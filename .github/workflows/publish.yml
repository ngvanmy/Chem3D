name: 'publish'

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install

      - name: Normalize updater signing key format
        shell: pwsh
        env:
          RAW_TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          $key = $env:RAW_TAURI_SIGNING_PRIVATE_KEY
          if (-not $key) {
            throw "TAURI_SIGNING_PRIVATE_KEY secret is missing."
          }

          $key = $key.Replace('\r\n', "`n").Replace('\n', "`n").Replace("`r`n", "`n")

          if (-not $key.StartsWith('untrusted comment:')) {
            $key = "untrusted comment: minisign encrypted secret key`n$key"
          }

          @"
          TAURI_SIGNING_PRIVATE_KEY<<EOF
          $key
          EOF
          "@ | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build and release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'Chem3D v__VERSION__'
          releaseBody: 'Bản phát hành tự động của ứng dụng Chem3D. Vui lòng xem tệp latest.json để xem thông số cập nhật tự động.'
          releaseDraft: true
          prerelease: false
